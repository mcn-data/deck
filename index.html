<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard MCN</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  .card { background:var(--card); padding:40px 48px; border-radius:16px; max-width:520px; text-align:center; }
  h1 { margin:0 0 8px; font-size:28px; }
  p  { margin:0; color:var(--muted); line-height:1.6; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent);
         margin-right:8px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  footer { position:fixed; left:12px; bottom:10px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>Dashboard MCN</h1>
    <p><span class="dot"></span>Sedang dibangun. Dashboard performa digital akan tampil di halaman ini.</p>
  </div>
  <!-- Nomor Build: cara memastikan yang dibuka bukan salinan lama (cache browser). -->
  <footer>Build 0 · 18 Nov 2026</footer>
</body>
</html>
